<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LectureTracker | Secure Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --bg: #020617;
  --card-bg: rgba(15, 23, 42, 0.85);
  --accent: #38bdf8;
  --text-main: #f8fafc;
  --text-dim: #94a3b8;
  --border: rgba(255,255,255,0.08);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text-main);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* 🔥 Removed heavy blur + animation (major lag fix) */

.card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
  padding:32px;
  border-radius:20px;
  width:95%;
  max-width:420px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2 {
  font-size:24px;
  margin-bottom:10px;
}

p {
  font-size:14px;
  color:var(--text-dim);
  margin-bottom:24px;
}

.input-group {
  margin-bottom:16px;
  position:relative;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  outline:none;
}

input:focus {
  border-color:var(--accent);
}

.toggle-pass {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  cursor:pointer;
  color:var(--accent);
}

.btn-container {
  height:48px;
  margin-top:20px;
}

button {
  width:100%;
  height:100%;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.primary-btn {
  background:var(--accent);
  color:black;
  display:flex;
  justify-content:center;
  align-items:center;
}

.primary-btn:disabled {
  background:#1e293b;
  color:#475569;
}

.loader {
  display:none;
  width:20px;
  height:20px;
  border:3px solid rgba(255,255,255,0.2);
  border-top:3px solid var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.back-btn {
  margin-top:10px;
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
}

.forgot-password {
  margin-top:16px;
  text-align:center;
  display:block;
  font-size:13px;
  color:var(--accent);
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <h2>Access Data</h2>
  <p>Verify your identity to retrieve records.</p>

  <div class="input-group">
    <input type="email" id="email" placeholder="Email Address" oninput="validateForm()">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Security Password" oninput="validateForm()">
    <span class="toggle-pass" onclick="togglePassword()">Show</span>
  </div>

  <div class="btn-container">
    <button id="fetchBtn" class="primary-btn" onclick="handleFetch()" disabled>
      <span id="btnText">Fetch Records</span>
      <div id="btnLoader" class="loader"></div>
    </button>
  </div>

  <button class="back-btn" onclick="goBack()">Cancel</button>

  <a class="forgot-password" onclick="goToOtp()">Forgot password?</a>
</div>

<script>
lucide.createIcons();

function validateForm() {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();
  const btn = document.getElementById("fetchBtn");

  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && pass.length > 0;
  btn.disabled = !valid;
}

function togglePassword() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}

function handleFetch() {
  const btn = document.getElementById("fetchBtn");
  const text = document.getElementById("btnText");
  const loader = document.getElementById("btnLoader");

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  // Show spinner
  btn.disabled = true;
  text.style.display = "none";
  loader.style.display = "block";

  const url = window.location.origin +
    "/viewData/?email=" +
    encodeURIComponent(email) +
    "&password=" +
    encodeURIComponent(password);

  // Fast redirect (no lag)
  window.location.href = url;
}

function resetUI() {
  const btn = document.getElementById("fetchBtn");
  const text = document.getElementById("btnText");
  const loader = document.getElementById("btnLoader");

  loader.style.display = "none";
  text.style.display = "block";
  text.innerText = "Fetch Records";

  document.getElementById("password").value = "";
  validateForm();
}

// 🔥 Fix back-navigation UI bug
window.addEventListener("pageshow", resetUI);

function goBack() {
  window.history.back();
}

function goToOtp() {
  window.location.href = window.location.origin + "/otp/?heading=PASSWORD RESET";
}
</script>

</body>
</html>
