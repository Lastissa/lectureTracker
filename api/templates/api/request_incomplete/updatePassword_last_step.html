{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
<style>
  * {
  box-sizing: border-box;
  font-family: system-ui, Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
}

.container {
  width: 380px;
  padding: 28px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  text-align: center;
}

/* EMAIL */
.email-box {
  font-size: 13px;
  margin-bottom: 12px;
  padding: 8px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: #cbd5e1;
}

.email-box span {
  color: #60a5fa;
  font-weight: 600;
}

/* OTP */
.otp-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 18px 0;
}

.otp-box {
  width: 42px;
  height: 48px;
  text-align: center;
  font-size: 20px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: white;
}

/* PASSWORD */
.password-wrapper {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  align-items: center;
}

.password-wrapper input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: white;
}

/* TOGGLE */
.toggle-switch {
  width: 46px;
  height: 24px;
  position: relative;
}

.toggle-switch input {
  display: none;
}

.slider {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.2);
  border-radius: 24px;
  cursor: pointer;
  transition: 0.3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-switch input:checked + .slider {
  background: #3b82f6;
}

.toggle-switch input:checked + .slider:before {
  transform: translateX(22px);
}

/* BUTTON */
button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#3b82f6,#6366f1);
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <!-- EMAIL DISPLAY -->
  <div class="email-box">
    <span id="emailDisplay"></span>
  </div>

  <h3>Enter OTP</h3>

  <div id="otpContainer" class="otp-container"></div>

  <div class="password-wrapper">
    <input type="password" id="newPassword" placeholder="New Password" />

    <label class="toggle-switch">
      <input type="checkbox" id="togglePassword">
      <span class="slider"></span>
    </label>
  </div>

  <button id="saveBtn">Save</button>

</div>

<script>

  const params = new URLSearchParams(window.location.search);

const email = params.get("email") || "unknown@email.com";
const otpValue = params.get("otp") || "";
const otpLength = otpValue.length;

// show email
document.getElementById("emailDisplay").textContent = email;

// build OTP inputs
const otpContainer = document.getElementById("otpContainer");

for (let i = 0; i < otpLength; i++) {
  const input = document.createElement("input");
  input.className = "otp-box";
  input.maxLength = 1;

  input.addEventListener("input", (e) => {
    if (e.target.value && e.target.nextElementSibling) {
      e.target.nextElementSibling.focus();
    }
  });

  otpContainer.appendChild(input);
}

// toggle password
document.getElementById("togglePassword").addEventListener("change", function () {
  const input = document.getElementById("newPassword");
  input.type = this.checked ? "text" : "password";
});

// save button
document.getElementById("saveBtn").addEventListener("click", () => {
  const inputs = document.querySelectorAll(".otp-box");

  let otp = "";
  inputs.forEach(i => otp += i.value);

  const password = document.getElementById("newPassword").value;

  handleSave(otp, password);
});

function handleSave(otp, password) {
  // backend logic later
}
</script></body>
</html>
