{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>

<link rel="stylesheet" href="{% static 'api/css/updatePassword_last_step.css' %}">
</head>

<body>

<div class="container">

  <!-- EMAIL DISPLAY -->
  <div class="email-box">
    <span id="emailDisplay"></span>
  </div>

  <h3>Enter OTP</h3>

  <div id="otpContainer" class="otp-container"></div>

  <div class="password-wrapper">
    <input type="password" id="newPassword" placeholder="New Password" />

    <label class="toggle-switch">
      <input type="checkbox" id="togglePassword">
      <span class="slider"></span>
    </label>
  </div>

  <button id="saveBtn">Save</button>

</div>

<script src="{% static 'api/js/updatePassword_last_step.js' %}"></script></body>
</html>
