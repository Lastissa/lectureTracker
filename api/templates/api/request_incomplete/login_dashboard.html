<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root{
    --bg-0: #0b0d14;
    --bg-1: #131620;
    --card: rgba(20, 23, 34, 0.6);
    --card-2: rgba(26, 30, 43, 0.8);
    --border: rgba(255, 255, 255, 0.06);
    --text: #f2f4f8;
    --muted: #9aa2b5;
    --accent: #6d8bff;
    --red: #ff4d5a;
    --green: #22c55e;
    --purple: #a78bfa;
    --radius-lg: 24px;
    --radius-md: 18px;
    --shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html, body{
    max-width: 100vw;
    overflow-x: hidden; /* kill horizontal scroll on body */
  }
  body{
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: 
      radial-gradient(800px 500px at 80% -10%, rgba(109,139,255,0.18) 0%, transparent 60%),
      radial-gradient(600px 400px at 10% 110%, rgba(167,139,250,0.15) 0%, transparent 60%),
      var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px 60px;
  }

  .wrap{
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 24px;
    grid-template-areas:
      "header header"
      "stats history"
      "info history";
    min-width: 0; /* critical for grid children not to overflow */
  }

  header, .stats, .info, .history{
    min-width: 0; /* allow children to shrink below content size */
  }

  header{
    grid-area: header;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }

  .welcome h1{
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .welcome p{
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    word-break: break-all;
  }

  .logout{
    padding: 10px 16px;
    background: rgba(255,77,90,0.12);
    border: 1px solid rgba(255,77,90,0.25);
    color: #ffb3b8;
    border-radius: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .logout:hover{
    background: rgba(255,77,90,0.2);
    transform: translateY(-1px);
  }

  .stats{
    grid-area: stats;
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    min-width: 0;
  }
  .stats h2{
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .stat-box{
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .stat-track{
    display: flex;
    gap: 14px;
    width: max-content; /* let it be wider than container for scroll */
    padding-bottom: 6px;
  }

  .stat-card{
    flex: 0 0 160px; /* fixed width, no shrinking */
    height: 120px;
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .stat-card .num{
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1;
    align-self: center;
    margin-top: 10px;
  }
  .stat-card .label{
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0.9;
  }

  .stat-card.missed{background: var(--red);}
  .stat-card.attend{background: var(--green);}
  .stat-card.null{background: var(--purple);}

  .info{
    grid-area: info;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
    min-width: 0;
  }
  .info-card{
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 0;
  }
  .info-label{
    font-size: 0.72rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .info-value{
    font-size: 0.95rem;
    font-weight: 500;
    word-break: break-all;
  }

  .history{
    grid-area: history;
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 250px;
    min-width: 0;
    max-width: 100%;
  }
  .history h2{
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .history-scroll{
    display: flex;
    gap: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 10px;
    scroll-snap-type: x mandatory;
    max-width: 100%;
  }
  .history-scroll::-webkit-scrollbar{height: 6px;}
  .history-scroll::-webkit-scrollbar-thumb{background: var(--border);border-radius: 10px;}

  .history-item{
    flex: 0 0 240px; /* fixed width, prevents stretching */
    height: 140px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14px;
    scroll-snap-align: start;
    font-size: 0.85rem;
    color: var(--muted);
    word-break: break-word;
  }

  .spinner{
    width: 28px;height: 28px;
    border: 3px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform: rotate(360deg)}}

  @media (max-width: 980px){
    .wrap{
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "stats"
        "info"
        "history";
    }
    .info{grid-template-columns: 1fr;}
    body{padding: 20px 16px 50px;}
  }
/* Floating AI button */
.ai-fab{
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px rgba(109,139,255,0.4);
  cursor: pointer;
  z-index: 100;
  transition: transform 0.2s ease;
}
.ai-fab:hover{transform: scale(1.08);}
.ai-fab svg{width: 26px; height: 26px; fill: white;}

/* Overlay page */
.ai-overlay{
  position: fixed;
  inset: 0;
  background: rgba(11,13,20,0.95);
  backdrop-filter: blur(12px);
  z-index: 200;
  display: none;
  flex-direction: column;
  padding: 24px 20px;
}
.ai-overlay.active{display: flex;}

.ai-header{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.ai-back{
  padding: 8px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;
}
.ai-title{font-size: 1.1rem; font-weight: 600;}

.ai-content{
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}
.ai-message{
  font-size: 1rem;
  line-height: 1.6;
  color: var(--text);
  max-width: 700px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<!-- Floating AI Button -->
<div class="ai-fab" id="aiFab">
  <svg viewBox="0 0 24 24">
    <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73A2.002 2.002 0 0 1 12 2m0 10a5 5 0 0 0-5 5v1h10v-1a5 5 0 0 0-5-5Z"/>
  </svg>
</div>

<!-- AI Overlay -->
<div class="ai-overlay" id="aiOverlay">
  <div class="ai-header">
    <button class="ai-back" id="aiBack">← Back</button>
    <div class="ai-title">AI Analysis</div>
  </div>
  <div class="ai-content" id="aiContent">
    <div class="spinner"></div>
  </div>
</div>
<div class="wrap">

  <header>
    <div class="welcome">
      <h1>Welcome back, {{ username }}</h1>
    </div>
    <a href="/cleartoken/?email={{ email }}" class="logout">Logout</a>
  </header>

  <section class="stats">
    <h2>Activity</h2>
    <div class="stat-box">
      <div class="stat-track">
        <div class="stat-card missed">
          <div class="num">20</div>
          <div class="label">Missed</div>
        </div>
        <div class="stat-card attend">
          <div class="num">25</div>
          <div class="label">Attend</div>
        </div>
        <div class="stat-card null">
          <div class="num">5</div>
          <div class="label">Nullified</div>
        </div>
      </div>
    </div>
  </section>

  <section class="info">
    <div class="info-card">
      <div class="info-label">Email</div>
      <div class="info-value">{{ email }}</div>
    </div>
    <div class="info-card">
      <div class="info-label">Date Joined</div>
      <div class="info-value">{{ date_joined }}</div>
    </div>
    <div class="info-card">
      <div class="info-label">Last Login</div>
      <div class="info-value">{{ last_login }}</div>
    </div>
  </section>

  <section class="history">
    <h2>HISTORY</h2>
    <div class="history-scroll" id="historyContainer">
      <div class="history-item"><div class="spinner"></div></div>
    </div>
  </section>

</div>

<script>
async function loadHistory(){
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.has('email2')){
    urlParams.set('email', urlParams.get('email2'));
    urlParams.delete('email2');
  }
  const queryString = urlParams.toString();
  const endpoint = `/viewData/json${queryString ? '?' + queryString : ''}`;

  try{
    const res = await fetch(endpoint);
    const data = await res.json();
    const container = document.getElementById('historyContainer');
    container.innerHTML = '';

    if(data.history && data.history.length){
      data.history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-item';
        card.textContent = typeof item === 'object' ? JSON.stringify(item) : item;
        container.appendChild(card);
      });
    } else {
      container.innerHTML = '<div class="history-item">No history found</div>';
    }
  } catch(e){
    document.getElementById('historyContainer').innerHTML = 
      '<div class="history-item">Failed to load history</div>';
    console.error(e);
  }
}

// AI Overlay logic
const aiFab = document.getElementById('aiFab');
const aiOverlay = document.getElementById('aiOverlay');
const aiBack = document.getElementById('aiBack');
const aiContent = document.getElementById('aiContent');

aiFab.addEventListener('click', openAIOverlay);
aiBack.addEventListener('click', closeAIOverlay);

function openAIOverlay(){
  aiOverlay.classList.add('active');
  aiContent.innerHTML = '<div class="spinner"></div>';
  fetchAIAnalysis();
}

function closeAIOverlay(){
  aiOverlay.classList.remove('active');
}

async function fetchAIAnalysis(){
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.has('email2')){
    urlParams.set('email', urlParams.get('email2'));
    urlParams.delete('email2');
  }
  const queryString = urlParams.toString();
  const endpoint = `/ai/?${queryString}`;

  try{
    const res = await fetch(endpoint);
    const data = await res.json();
    aiContent.innerHTML = `<div class="ai-message">${data.message || 'No message returned'}</div>`;
  } catch(e){
    aiContent.innerHTML = `<div class="ai-message">Failed to load AI analysis</div>`;
    console.error(e);
  }
}

window.addEventListener('load', () => setTimeout(loadHistory, 1000));
</script>
</body>
</html>
