{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- ===== CHARACTER ENCODING & VIEWPORT ===== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <!-- ===== PRIMARY SEO ===== -->
  <title>Lecture Tracker · Secure Login – Track it, Attend it</title>
  <meta name="description" content="Secure login for Lecture Tracker – the smart academic attendance system. Track lectures, monitor attendance, and stay disciplined. Track it, Attend it." />
  <link rel="canonical" href="https://lecture-tracker-omega.vercel.app/login/" />

  <!-- ===== ROBOTS ===== -->
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="robots" content="noarchive" />

  <!-- ===== OPEN GRAPH (WhatsApp, Facebook, etc.) ===== -->
  <meta property="og:title" content="Lecture Tracker · Secure Academic Login" />
  <meta property="og:description" content="Track it, Attend it. Login to your academic dashboard and take control of your attendance consistency." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lecture-tracker-omega.vercel.app/login/" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=1200&h=630&fit=crop&crop=center" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Lecture Tracker" />
  <meta property="og:locale" content="en_US" />

  <!-- ===== TWITTER CARD ===== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lecture Tracker · Secure Academic Login" />
  <meta name="twitter:description" content="Track it, Attend it. Login to your academic dashboard and take control of your attendance consistency." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=1200&h=630&fit=crop&crop=center" />
  <meta name="twitter:site" content="@LectureTracker" />

  <!-- ===== SECURITY & PRIVACY ===== -->
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ===== BROWSER THEME COLOR ===== -->
  <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

  <!-- ===== FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- ===== STYLESHEET ===== -->
  <link rel="stylesheet" href="{% static 'admin/admin_css/login.css' %}" />
</head>
<body>

  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="top-controls">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme between light and dark">
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </div>

  <main class="login-container">
    <div class="login-card">
      <header class="brand-header">
        <h1 class="logo-text">Lecture Tracker</h1>
        <span class="badge-sub">Secure Verification</span>
      </header>

      <div class="error-drawer" id="authErrorBlock" role="alert" aria-live="polite" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorTextContent">Validation failed.</span>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="input-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" class="input-field" placeholder="identity@domain.com" required autocomplete="username" inputmode="email" />
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="adminPassword">Password</label>
            <a href="/otp/?heading=PASSWORD%20RESET" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="adminPassword" class="input-field" placeholder="••••••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Login</span>
        </button>
      </form>

      <div class="divider" role="separator"></div>

      <button type="button" class="btn-support" id="supportBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Contact Support Assistance
      </button>
    </div>
  </main>

  <script src="{% static 'admin/admin_js/login.js' %}" defer></script>
</body>
</html>
