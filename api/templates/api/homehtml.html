<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Control Panel</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: radial-gradient(circle at top, #0b1220, #060913);
    color: #e2e8f0;
    padding: 50px 16px;
    display: flex;
    justify-content: center;
}

/* WRAPPER (FIXES TOO WIDE ISSUE) */
.wrapper {
    width: 100%;
    max-width: 980px;
}

/* HEADER */
h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 40px;
    color: #38bdf8;
    letter-spacing: 1px;
}

/* SECTION CARD */
.section {
    background: rgba(17, 24, 39, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
}

/* SECTION TITLE */
.section h3 {
    margin-top: 0;
    margin-bottom: 16px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
}

/* BUTTON BASE */
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: #e2e8f0;
    background: rgba(31, 41, 55, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.18);
    transition: 0.25s ease;
    font-size: 14px;
    position: relative;
    overflow: hidden;
}

/* HOVER LIFT + GLOW */
.btn:hover {
    transform: translateY(-3px);
    border-color: #38bdf8;
    box-shadow: 0 10px 25px rgba(56,189,248,0.15);
}

/* subtle glow sweep */
.btn::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100%;
    top: 0;
    left: -120px;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.2), transparent);
    transition: 0.6s;
}

.btn:hover::before {
    left: 120%;
}

/* VARIANTS */
.btn-danger {
    background: rgba(127, 29, 29, 0.25);
    border-color: rgba(239, 68, 68, 0.35);
}

.btn-danger:hover {
    border-color: #ef4444;
    box-shadow: 0 10px 25px rgba(239,68,68,0.2);
}

.btn-warning {
    background: rgba(161, 98, 7, 0.25);
    border-color: rgba(250, 204, 21, 0.35);
}

.btn-warning:hover {
    border-color: #facc15;
    box-shadow: 0 10px 25px rgba(250,204,21,0.2);
}

.btn-primary {
    background: rgba(29, 78, 216, 0.2);
    border-color: rgba(56, 189, 248, 0.3);
}

.btn-primary:hover {
    border-color: #38bdf8;
}

/* NOTE */
.note {
    font-size: 12px;
    color: #64748b;
    margin-top: 10px;
}

/* MOBILE TWEAK */
@media (max-width: 600px) {
    h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<h1>API CONTROL PANEL</h1>

<!-- DATA -->
<div class="section">
    <h3>Data Management</h3>
    <div class="grid">
        <a href="/viewData/" class="btn btn-primary">View Single Data</a>
        <a href="/backupData/" class="btn">Backup Data</a>
        <a href="/viewAllData/" class="btn btn-warning">View All Data</a>
    </div>
</div>

<!-- ACCOUNT -->
<div class="section">
    <h3>Account Settings</h3>
    <div class="grid">
        <a href="/otp/?heading=username reset" class="btn">Update Username</a>
        <a href="/otp/?heading=email reset" class="btn">Update Email</a>
        <a href="/otp/?heading=password reset" class="btn">Update Password</a>
    </div>
</div>

<!-- DANGER -->
<div class="section">
    <h3 style="color:#f87171;">Danger Zone</h3>
    <div class="grid">
        <a href="/deactivateAccount/" class="btn btn-danger">Deactivate Account</a>
        <a href="/deleteAllData/" class="btn btn-danger">Delete All Data</a>
    </div>
</div>

<!-- OTHER -->
<div class="section">
    <h3>Other</h3>
    <div class="grid">
        <a href="/api_doc/" class="btn btn-primary">API Documentation</a>
    </div>
    <div class="note">
        Developer tools and internal documentation access
    </div>
</div>

</div>

</body>
</html>
