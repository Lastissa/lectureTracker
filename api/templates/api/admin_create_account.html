<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Account Creation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.4);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.1);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.1);
      --editor-bg: #0b0f19;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .terminal-container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 1;
      overflow: hidden;
    }

    /* Postman App Header Lookalike */
    .terminal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tab-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .method-post {
      font-size: 0.75rem;
      font-weight: 800;
      color: #fb923c;
      letter-spacing: 0.05em;
    }

    .terminal-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .terminal-body {
      padding: 1.75rem;
    }

    /* Workspace Framing */
    .workspace-pane {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .pane-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    /* Code Editor Field Layout */
    .editor-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background-color: var(--editor-bg);
      transition: border-color 0.2s ease;
    }

    .editor-wrapper:focus-within {
      border-color: var(--primary);
    }

    .json-textarea {
      width: 100%;
      height: 280px;
      background: transparent;
      border: none;
      outline: none;
      padding: 1.25rem;
      color: #38bdf8;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: vertical;
    }

    /* Action Deck Button Transitions */
    .action-deck {
      display: flex;
      justify-content: flex-end;
      min-height: 48px;
    }

    .btn-transmit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0 1.75rem;
      height: 48px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-transmit.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-transmit:hover {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    /* Dynamic Response Modules */
    .response-wrapper {
      margin-top: 1.5rem;
      display: none;
    }

    /* Performance Skeleton State */
    .skeleton-loader {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--card-border);
      border-radius: 14px;
    }

    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Status Window Canvas */
    .response-canvas {
      border-radius: 14px;
      padding: 1.25rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      overflow-x: auto;
      border: 1px solid transparent;
    }

    .response-canvas.success {
      background: var(--success-glow);
      border-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .response-canvas.error {
      background: var(--danger-glow);
      border-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .canvas-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="terminal-container">
    <div class="terminal-header">
      <div class="tab-badge">
        <span class="method-post">POST</span>
        <span class="terminal-title">Lecture Tracker Admin</span>
      </div>
    </div>

    <div class="terminal-body">
      <div class="workspace-pane">
        <span class="pane-title">Raw JSON Payload</span>
        
        <div class="editor-wrapper">
          <textarea 
            id="jsonEditor" 
            class="json-textarea" 
            placeholder='{\n  "key": "value"\n}' 
            spellcheck="false"
          ></textarea>
        </div>

        <div class="action-deck">
          <button id="transmitBtn" class="btn-transmit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Create account
          </button>
        </div>

        <!-- Skeleton Screen Module -->
        <div id="skeletonScreen" class="skeleton-loader">
          <div class="skeleton-line" style="width: 40%;"></div>
          <div class="skeleton-line" style="width: 85%;"></div>
          <div class="skeleton-line" style="width: 60%;"></div>
        </div>

        <!-- Output Display Panel -->
        <div id="responseWrapper" class="response-wrapper">
          <span class="pane-title" style="display: block; margin-bottom: 0.5rem;">Console Console Output</span>
          <div id="responseCanvas" class="response-canvas"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const jsonEditor = document.getElementById('jsonEditor');
    const transmitBtn = document.getElementById('transmitBtn');
    const skeletonScreen = document.getElementById('skeletonScreen');
    const responseWrapper = document.getElementById('responseWrapper');
    const responseCanvas = document.getElementById('responseCanvas');

    // Input Evaluation Loop (Tracks visibility cleanly)
    jsonEditor.addEventListener('input', () => {
      const payload = jsonEditor.value.trim();
      if (payload.length > 0) {
        transmitBtn.classList.add('visible');
      } else {
        transmitBtn.classList.remove('visible');
      }
    });

    // Request Dispatch System
    transmitBtn.addEventListener('click', async () => {
      const rawBody = jsonEditor.value.trim();
      
      // Standard Client-side sanity check for valid JSON
      try {
        JSON.parse(rawBody);
      } catch (err) {
        renderOutput({ error: "Malformed structural syntax. Verify raw JSON markup configurations." }, false, 400);
        return;
      }

      // Transition layouts to active state
      responseWrapper.style.display = 'none';
      skeletonScreen.style.display = 'flex';
      transmitBtn.disabled = true;

      try {
        const response = await fetch('/createAdminAccountLogic/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken') || ''
          },
          body: rawBody
        });

        const data = await response.json();
        renderOutput(data, response.ok, response.status);

      } catch (networkError) {
        renderOutput({ 
          status: "Connection Refused",
          message: "Could not pipeline parameters to upstream hosting matrix. Check connections." 
        }, false, "NET_ERR");
      } finally {
        skeletonScreen.style.display = 'none';
        transmitBtn.disabled = false;
      }
    });

    // Content Presenter Pipeline
    function renderOutput(payload, isSuccess, statusCode) {
      responseCanvas.className = `response-canvas ${isSuccess ? 'success' : 'error'}`;
      
      responseCanvas.innerHTML = `
        <div class="canvas-meta">
          <span>STATUS: ${statusCode}</span>
          <span>${isSuccess ? 'COMPLETED' : 'EXCEPTION'}</span>
        </div>
        <pre>${JSON.stringify(payload, null, 2)}</pre>
      `;
      
      responseWrapper.style.display = 'block';
    }

    // CSRF Utility Loader
    function getCookie(name) {
      let value = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            value = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return value;
    }
  </script>
</body>
</html>
