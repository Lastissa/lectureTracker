<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Restricted</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #fff;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 30px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .home-btn {
      background: #4CAF50;
      color: white;
    }

    .home-btn:hover {
      background: #43a047;
      transform: translateY(-2px);
    }

    .back-btn {
      background: transparent;
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
  </style></head>
<body>  <div class="container">
    <div class="icon">🚫</div>
    <h1>Access Restricted</h1>
    <p>You do not have permission to view this page. Please contact the <a id="adminLink" href="#" target="_blank" style="color:#8fd3ff; text-decoration: underline;">administrator</a> if you believe this is an error.</p><div class="btn-group">
  <button class="home-btn" onclick="goHome()">Home</button>
  <button class="back-btn" onclick="goBack()">Go Back</button>
</div>

  </div>  <script>
    function goHome() {
      window.location.href = window.location.origin;
    }

    function goBack() {
      window.history.back();
    }

    // Build WhatsApp link with prefilled message and URL
    (function () {
      const base = "https://wa.me/+2348113577875";
      const previousUrl = window.location.href;

      const message = `I cant reset my password at the said URL: ${previousUrl}`;
      const encoded = encodeURIComponent(message);

      const link = document.getElementById("adminLink");
      if (link) {
        link.href = `${base}?text=${encoded}`;
      }
    })();
  </script></body>
</html>
